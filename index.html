<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公司便當點餐</title>
  <style>
    :root {
      --bg: #f7f3ec;
      --card: #ffffff;
      --text: #2e2924;
      --muted: #7c746c;
      --line: #e9e1d8;
      --accent: #9b5f39;
      --accent-dark: #7f4929;
      --success: #2e7d57;
      --danger: #b94141;
      --soft: #f0e4d9;
      --shadow: 0 10px 30px rgba(63, 44, 30, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f7f3ec 0%, #efe6dc 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", sans-serif;
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: .02em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .admin-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.8);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.75);
    }

    .restaurant-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .restaurant-name {
      font-size: 22px;
      font-weight: 800;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      background: #e9f5ef;
      border-radius: 999px;
      padding: 8px 10px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .menu-image-wrap {
      border-radius: 18px;
      overflow: hidden;
      background: #eee7df;
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      cursor: zoom-in;
    }

    .menu-images {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 8px;
      padding: 8px;
    }

    .menu-images.count-2 { grid-template-columns: repeat(2, 1fr); }
    .menu-images.count-3 { grid-template-columns: repeat(3, 1fr); }

    .menu-images img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      min-width: 0;
      cursor: zoom-in;
      border-radius: 12px;
    }

    .menu-library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .menu-library-item {
      position: relative;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      background: #fff;
      cursor: pointer;
    }

    .menu-library-item.selected {
      border-color: var(--accent);
      background: #fff8f2;
    }

    .menu-library-item img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #f4eee8;
      border-radius: 9px;
    }

    .menu-library-item input { position: absolute; top: 14px; left: 14px; }
    .menu-library-name { font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }

    .image-placeholder {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .image-placeholder .emoji {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .order-items { display: grid; gap: 12px; }

    .order-item-row {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) 100px 82px 42px;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #faf6f1;
    }

    .order-item-row input {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      border-radius: 11px;
      padding: 10px;
    }

    .order-item-note { grid-column: 1 / -1; }

    .remove-order-item {
      border: 0;
      border-radius: 10px;
      background: #f6e8e8;
      color: var(--danger);
      cursor: pointer;
    }

    select, input[type="text"], input[type="number"], input[type="time"], input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px 13px;
      outline: none;
      transition: .2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(155,95,57,.12);
    }

    .menu-list {
      display: grid;
      gap: 10px;
    }

    .menu-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: .18s;
    }

    .menu-item:hover {
      transform: translateY(-1px);
      border-color: #d7c6b7;
    }

    .menu-item.selected {
      border-color: var(--accent);
      background: #fff8f2;
      box-shadow: 0 0 0 2px rgba(155,95,57,.10);
    }

    .menu-item input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 800;
    }

    .item-category {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .item-price {
      font-weight: 900;
      color: var(--accent-dark);
      white-space: nowrap;
    }

    .summary {
      margin-top: 16px;
      background: #faf6f1;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
    }

    .summary-row.total {
      font-size: 18px;
      font-weight: 900;
      border-top: 1px dashed #d9c8b9;
      margin-top: 6px;
      padding-top: 12px;
    }

    .self-pay {
      color: var(--danger);
      font-weight: 900;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px;
      background: var(--accent);
      color: white;
      font-weight: 900;
      cursor: pointer;
      margin-top: 14px;
      transition: .2s;
    }

    .submit-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      margin-top: 12px;
      min-height: 24px;
      font-size: 14px;
      text-align: center;
      font-weight: 700;
    }

    .notice.ok { color: var(--success); }
    .notice.error { color: var(--danger); }

    .admin-panel {
      display: none;
      margin-top: 16px;
    }

    .admin-panel.show {
      display: block;
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .admin-badge {
      background: #2f2b27;
      color: white;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .small-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .small-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .small-btn.danger {
      color: var(--danger);
    }

    .admin-menu-row {
      display: grid;
      grid-template-columns: 1fr 110px 96px 42px;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .admin-menu-row button {
      border: 0;
      background: #f6e8e8;
      color: var(--danger);
      border-radius: 10px;
      height: 42px;
      cursor: pointer;
    }

    .orders-box {
      margin-top: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 11px 8px;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(28,22,18,.55);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 100;
    }

    .modal.show { display: grid; }

    .modal-card {
      background: white;
      width: min(420px, 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 70px rgba(0,0,0,.2);
    }

    .modal-card h3 {
      margin: 0 0 12px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
    }

    .image-modal img {
      max-width: min(100%, 880px);
      max-height: 88vh;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .admin-grid { grid-template-columns: 1fr; }
      .order-item-row {
        grid-template-columns: minmax(0, 1fr) 82px 42px;
      }
      .order-item-name { grid-column: 1 / -1; }
      .order-item-price { grid-column: 1; }
      .order-item-quantity { grid-column: 2; }
      .remove-order-item { grid-column: 3; }
      .admin-menu-row {
        grid-template-columns: 1fr 88px 82px 42px;
      }
      .topbar { align-items: flex-start; }
      .admin-btn { padding: 9px 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>🍱 公司便當點餐</h1>
        <p>每人公司補助上限 150 元，超過部分自行支付</p>
      </div>
      <button class="admin-btn" id="adminOpenBtn">⚙️ 管理模式</button>
    </header>

    <section class="grid">
      <article class="card">
        <div class="restaurant-row">
          <div>
            <div class="restaurant-name" id="restaurantNameText">今日便當店</div>
            <div class="meta">截止時間：<span id="deadlineText">10:30</span></div>
          </div>
          <div class="status" id="openStatus">● 開放點餐</div>
        </div>

        <div class="menu-image-wrap" id="menuImageWrap">
          <div class="menu-images" id="menuImages"></div>
          <div class="image-placeholder" id="imagePlaceholder">
            <div class="emoji">🖼️</div>
            <div>尚未上傳店家菜單</div>
          </div>
        </div>
        <div class="hint">點一下圖片可放大查看</div>
      </article>

      <article class="card">
        <h2 class="section-title">開始點餐</h2>

        <div class="field">
          <label for="employeeSelect">我是誰？</label>
          <select id="employeeSelect">
            <option value="">請選擇姓名</option>
            <option>葉董</option>
            <option>佩晴</option>
            <option>佩雯</option>
            <option>淑君</option>
            <option>AK</option>
            <option>宜勻</option>
            <option>庸冊</option>
          </select>
        </div>

        <div class="field">
          <label>我想吃什麼？</label>
          <div class="order-items" id="orderItems"></div>
          <button class="small-btn" id="addOrderItemBtn" type="button" style="margin-top:10px">＋ 新增餐點</button>
          <input id="mealInput" type="hidden" />
          <input id="amountInput" type="hidden" />
        </div>

        <div class="field">
          <label for="noteInput">備註（可不填）</label>
          <textarea id="noteInput" placeholder="例如：飯少、不要香菜、醬另外放" style="width:100%;min-height:82px;border:1px solid var(--line);border-radius:14px;padding:12px 13px;resize:vertical;"></textarea>
        </div>

        <div class="summary">
          <div class="summary-row">
            <span>餐點總額</span>
            <strong><span id="totalAmount">0</span> 元</strong>
          </div>
          <div class="summary-row">
            <span>公司負擔</span>
            <strong><span id="companyAmount">0</span> 元</strong>
          </div>
          <div class="summary-row total">
            <span>自己支付</span>
            <span class="self-pay"><span id="selfPayAmount">0</span> 元</span>
          </div>
        </div>

        <button class="submit-btn" id="submitOrderBtn">送出訂單</button>
        <div class="notice" id="notice"></div>
      </article>
    </section>

    <section class="card admin-panel" id="adminPanel">
      <div class="admin-head">
        <h2 class="section-title" style="margin:0">管理設定</h2>
        <span class="admin-badge">管理者：庸冊</span>
      </div>

      <div class="admin-grid">
        <div class="field">
          <label for="restaurantInput">店家名稱</label>
          <input id="restaurantInput" type="text" value="今日便當店" />
        </div>
        <div class="field">
          <label for="deadlineInput">截止時間</label>
          <input id="deadlineInput" type="time" value="10:30" />
        </div>
        <div class="field">
          <label for="subsidyInput">每人補助上限</label>
          <input id="subsidyInput" type="number" value="150" min="0" />
        </div>
        <div class="field">
          <label for="openSelect">點餐狀態</label>
          <select id="openSelect">
            <option value="true">開放點餐</option>
            <option value="false">關閉點餐</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="imageUpload">上傳共用店家菜單圖片</label>
        <input id="imageUpload" type="file" accept="image/*,.heic,.heif" />
        <div class="meta" id="selectedImageInfo">可從手機相簿選擇 JPG、PNG、WebP、HEIC 等圖片</div>
      </div>

      <div class="admin-actions">
        <button class="small-btn primary" id="uploadMenuBtn">上傳到菜單圖片庫</button>
      </div>
      <div class="notice" id="uploadNotice"></div>

      <div class="field" style="margin-top:18px">
        <label>歷史菜單圖片（最多選擇 3 張）</label>
        <div class="meta">勾選今天要顯示的圖片，再按「套用所選菜單」。</div>
        <div class="menu-library" id="menuLibrary"></div>
        <div class="admin-actions">
          <button class="small-btn primary" id="applyMenusBtn">套用所選菜單</button>
          <button class="small-btn" id="refreshMenusBtn">重新整理圖片庫</button>
        </div>
        <div class="notice" id="libraryNotice"></div>
      </div>

      <div class="admin-actions">
        <button class="small-btn primary" id="saveSettingsBtn">儲存設定</button>
        <button class="small-btn danger" id="clearOrdersBtn">清除全部訂單</button>
        <button class="small-btn" id="logoutAdminBtn">離開管理模式</button>
      </div>

      <div class="orders-box">
        <h3>目前點餐狀況</h3>
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>餐點</th>
              <th>備註</th>
              <th>總額</th>
              <th>公司負擔</th>
              <th>自付</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="loginModal">
    <div class="modal-card">
      <h3>進入管理模式</h3>
      <div class="field">
        <label for="adminPassword">管理密碼</label>
        <input id="adminPassword" type="password" placeholder="請輸入密碼" />
      </div>
      <div class="meta">請輸入 Apps Script「ADMIN_UPLOAD_PASSWORD」設定的管理密碼</div>
      <div class="modal-actions">
        <button class="small-btn" id="cancelLoginBtn">取消</button>
        <button class="small-btn primary" id="loginBtn">登入</button>
      </div>
      <div class="notice error" id="loginNotice"></div>
    </div>
  </div>

  <div class="modal image-modal" id="imageModal">
    <img id="largeImage" alt="放大菜單" />
  </div>

  <script>
    const employeeNames = ["葉董", "佩晴", "佩雯", "淑君", "AK", "宜勻", "庸冊"];

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzoM9_TPHWF1MmAvJFYt8sHZmBztiO-OvGUn4YZoCFB7KaChvqqnHQexjWp8JZxgYb-/exec";

    const MENU_IMAGE_URL = "./menu.jpg";
    let adminUploadPassword = "";
    let selectedMenuFile = null;
    let menuLibraryState = { images: [], activeImages: [] };

    const state = JSON.parse(localStorage.getItem("lunchTextOrderState")) || {
      restaurant: "今日便當店",
      deadline: "10:30",
      subsidy: 150,
      isOpen: true,
      image: "",
      orders: {}
    };

    const els = {
      restaurantNameText: document.getElementById("restaurantNameText"),
      deadlineText: document.getElementById("deadlineText"),
      openStatus: document.getElementById("openStatus"),
      menuImages: document.getElementById("menuImages"),
      imagePlaceholder: document.getElementById("imagePlaceholder"),
      employeeSelect: document.getElementById("employeeSelect"),
      mealInput: document.getElementById("mealInput"),
      amountInput: document.getElementById("amountInput"),
      orderItems: document.getElementById("orderItems"),
      addOrderItemBtn: document.getElementById("addOrderItemBtn"),
      noteInput: document.getElementById("noteInput"),
      totalAmount: document.getElementById("totalAmount"),
      companyAmount: document.getElementById("companyAmount"),
      selfPayAmount: document.getElementById("selfPayAmount"),
      submitOrderBtn: document.getElementById("submitOrderBtn"),
      notice: document.getElementById("notice"),
      adminPanel: document.getElementById("adminPanel"),
      loginModal: document.getElementById("loginModal"),
      adminPassword: document.getElementById("adminPassword"),
      loginNotice: document.getElementById("loginNotice"),
      restaurantInput: document.getElementById("restaurantInput"),
      deadlineInput: document.getElementById("deadlineInput"),
      subsidyInput: document.getElementById("subsidyInput"),
      openSelect: document.getElementById("openSelect"),
      imageUpload: document.getElementById("imageUpload"),
      ordersBody: document.getElementById("ordersBody"),
      uploadMenuBtn: document.getElementById("uploadMenuBtn"),
      uploadNotice: document.getElementById("uploadNotice"),
      selectedImageInfo: document.getElementById("selectedImageInfo"),
      menuLibrary: document.getElementById("menuLibrary"),
      applyMenusBtn: document.getElementById("applyMenusBtn"),
      refreshMenusBtn: document.getElementById("refreshMenusBtn"),
      libraryNotice: document.getElementById("libraryNotice"),
      imageModal: document.getElementById("imageModal"),
      largeImage: document.getElementById("largeImage")
    };

    function persist() {
      localStorage.setItem("lunchTextOrderState", JSON.stringify(state));
    }

    function renderAll() {
      els.restaurantNameText.textContent = state.restaurant;
      els.deadlineText.textContent = state.deadline;
      els.openStatus.textContent = state.isOpen ? "● 開放點餐" : "● 已關閉點餐";
      els.openStatus.style.color = state.isOpen ? "var(--success)" : "var(--danger)";
      els.openStatus.style.background = state.isOpen ? "#e9f5ef" : "#fbeaea";

      els.restaurantInput.value = state.restaurant;
      els.deadlineInput.value = state.deadline;
      els.subsidyInput.value = state.subsidy;
      els.openSelect.value = String(state.isOpen);

      loadSharedMenuImage();

      els.submitOrderBtn.disabled = !state.isOpen;
      renderOrders();
      recalc();
    }

    function recalc() {
      const total = Math.max(Number(els.amountInput.value || 0), 0);
      const company = Math.min(total, Number(state.subsidy || 0));
      const selfPay = Math.max(total - Number(state.subsidy || 0), 0);

      els.totalAmount.textContent = total;
      els.companyAmount.textContent = company;
      els.selfPayAmount.textContent = selfPay;

      if (total > 300) {
        els.notice.textContent = "⚠️ 金額超過 300 元，請確認是否輸入正確";
        els.notice.className = "notice error";
      }
    }

    function renderOrders() {
      const orders = employeeNames.map(name => state.orders[name]).filter(Boolean);
      els.ordersBody.innerHTML = "";

      if (!orders.length) {
        els.ordersBody.innerHTML = '<tr><td colspan="6" class="empty">目前還沒有人點餐</td></tr>';
        return;
      }

      orders.forEach(order => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(order.name)}</td>
          <td>${escapeHtml(order.meal)}</td>
          <td>${escapeHtml(order.note || "—")}</td>
          <td>${order.total} 元</td>
          <td>${order.company} 元</td>
          <td>${order.selfPay} 元</td>
        `;
        els.ordersBody.appendChild(tr);
      });
    }

    function emptyOrderItem() {
      return { name: "", price: "", quantity: 1, note: "" };
    }

    function renderOrderItems(items = [emptyOrderItem()]) {
      const safeItems = items.length ? items : [emptyOrderItem()];
      els.orderItems.innerHTML = "";

      safeItems.forEach(item => {
        const row = document.createElement("div");
        row.className = "order-item-row";
        row.innerHTML = `
          <input class="order-item-name" type="text" placeholder="餐點名稱">
          <input class="order-item-price" type="number" min="0" inputmode="numeric" placeholder="單價">
          <input class="order-item-quantity" type="number" min="1" inputmode="numeric" value="1" title="數量">
          <button class="remove-order-item" type="button" title="刪除餐點">×</button>
          <input class="order-item-note" type="text" placeholder="這個餐點的備註（可不填）">
        `;

        row.querySelector(".order-item-name").value = item.name || "";
        row.querySelector(".order-item-price").value = item.price ?? "";
        row.querySelector(".order-item-quantity").value = Math.max(Number(item.quantity || 1), 1);
        row.querySelector(".order-item-note").value = item.note || "";

        row.querySelectorAll("input").forEach(input => {
          input.addEventListener("input", syncOrderItems);
        });

        row.querySelector(".remove-order-item").addEventListener("click", () => {
          if (els.orderItems.children.length === 1) {
            row.querySelectorAll("input").forEach(input => {
              input.value = input.classList.contains("order-item-quantity") ? "1" : "";
            });
          } else {
            row.remove();
          }
          syncOrderItems();
        });

        els.orderItems.appendChild(row);
      });

      syncOrderItems();
    }

    function getOrderItems() {
      return [...els.orderItems.querySelectorAll(".order-item-row")].map(row => ({
        name: row.querySelector(".order-item-name").value.trim(),
        price: Math.max(Number(row.querySelector(".order-item-price").value || 0), 0),
        quantity: Math.max(Number(row.querySelector(".order-item-quantity").value || 1), 1),
        note: row.querySelector(".order-item-note").value.trim()
      }));
    }

    function syncOrderItems() {
      const items = getOrderItems();
      els.mealInput.value = items
        .filter(item => item.name)
        .map(item => `${item.name} ×${item.quantity}${item.note ? `（${item.note}）` : ""}`)
        .join("\n");
      els.amountInput.value = items.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );
      recalc();
    }

    els.addOrderItemBtn.addEventListener("click", () => {
      renderOrderItems([...getOrderItems(), emptyOrderItem()]);
      els.orderItems.lastElementChild.querySelector(".order-item-name").focus();
    });

    els.employeeSelect.addEventListener("change", () => {
      const existing = state.orders[els.employeeSelect.value];

      if (existing) {
        renderOrderItems(
          Array.isArray(existing.items) && existing.items.length
            ? existing.items
            : [{ name: existing.meal, price: existing.total, quantity: 1, note: "" }]
        );
        els.noteInput.value = existing.note || "";
        els.notice.textContent = `${existing.name} 已經點過，可修改後再次送出`;
        els.notice.className = "notice ok";
        els.submitOrderBtn.textContent = "更新訂單";
      } else {
        renderOrderItems();
        els.noteInput.value = "";
        els.notice.textContent = "";
        els.notice.className = "notice";
        els.submitOrderBtn.textContent = "送出訂單";
      }

      recalc();
    });

els.submitOrderBtn.addEventListener("click", async () => {
      const name = els.employeeSelect.value;
      const meal = els.mealInput.value.trim();
      const total = Number(els.amountInput.value || 0);
      const note = els.noteInput.value.trim();
      const items = getOrderItems().filter(item => item.name || item.price > 0);

      if (!state.isOpen) return showError("目前已關閉點餐");
      if (!name) return showError("請先選擇姓名");
      if (!meal) return showError("請輸入餐點");
      if (items.some(item => !item.name || item.price <= 0)) {
        return showError("每個餐點都要填寫名稱和正確單價");
      }
      if (!Number.isFinite(total) || total <= 0) return showError("請輸入正確金額");

      if (total > 300 && !confirm(`你輸入的金額是 ${total} 元，確定正確嗎？`)) {
        return;
      }

      const company = Math.min(total, Number(state.subsidy || 150));
      const selfPay = Math.max(total - Number(state.subsidy || 150), 0);

      const formData = new FormData();
      formData.append("name", name);
      formData.append("meal", meal);
      formData.append("price", String(total));
      formData.append("note", note);
      formData.append("company", String(company));
      formData.append("selfPay", String(selfPay));

      els.submitOrderBtn.disabled = true;
      els.submitOrderBtn.textContent = "送出中…";
      els.notice.textContent = "正在送出訂單";
      els.notice.className = "notice";

      try {
        await fetch(
          "https://script.google.com/macros/s/AKfycbzoM9_TPHWF1MmAvJFYt8sHZmBztiO-OvGUn4YZoCFB7KaChvqqnHQexjWp8JZxgYb-/exec",
          {
            method: "POST",
            mode: "no-cors",
            body: formData
          }
        );

        state.orders[name] = {
          name,
          meal,
          items,
          note,
          total,
          company,
          selfPay,
          updatedAt: new Date().toLocaleString("zh-TW")
        };
        persist();
        renderOrders();

        els.notice.textContent =
          `✅ ${name} 的訂單已送出` +
          (selfPay > 0 ? `，需自行支付 ${selfPay} 元` : "");
        els.notice.className = "notice ok";

        renderOrderItems();
        els.noteInput.value = "";
        recalc();

      } catch (error) {
        console.error(error);
        els.notice.textContent = "❌ 送出失敗，請稍後再試";
        els.notice.className = "notice error";
      } finally {
        els.submitOrderBtn.disabled = !state.isOpen;
        els.submitOrderBtn.textContent = "送出訂單";
      }
    });

    document.getElementById("adminOpenBtn").addEventListener("click", () => {
      els.loginModal.classList.add("show");
      els.adminPassword.value = "";
      els.loginNotice.textContent = "";
      setTimeout(() => els.adminPassword.focus(), 50);
    });

    document.getElementById("cancelLoginBtn").addEventListener("click", () => {
      els.loginModal.classList.remove("show");
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const password = els.adminPassword.value.trim();

      if (!password) {
        els.loginNotice.textContent = "請輸入管理密碼";
        return;
      }

      const loginBtn = document.getElementById("loginBtn");
      loginBtn.disabled = true;
      loginBtn.textContent = "驗證中…";
      els.loginNotice.textContent = "";

      try {
        const formData = new FormData();
        formData.append("action", "verifyAdmin");
        formData.append("password", password);

        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: formData
        });
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || "管理密碼錯誤");
        }

        adminUploadPassword = password;
        els.loginModal.classList.remove("show");
        els.adminPanel.classList.add("show");
        loadMenuLibrary();
        els.adminPanel.scrollIntoView({ behavior: "smooth" });
      } catch (error) {
        adminUploadPassword = "";
        els.loginNotice.textContent = error.message || "管理密碼驗證失敗";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "登入";
      }
    });

    document.getElementById("logoutAdminBtn").addEventListener("click", () => {
      adminUploadPassword = "";
      selectedMenuFile = null;
      els.imageUpload.value = "";
      els.selectedImageInfo.textContent =
        "可從手機相簿選擇 JPG、PNG、WebP、HEIC 等圖片";
      els.uploadNotice.textContent = "";
      els.adminPanel.classList.remove("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      state.restaurant = els.restaurantInput.value.trim() || "今日便當店";
      state.deadline = els.deadlineInput.value || "10:30";
      state.subsidy = Math.max(Number(els.subsidyInput.value || 0), 0);
      state.isOpen = els.openSelect.value === "true";

      Object.values(state.orders).forEach(order => {
        order.company = Math.min(order.total, state.subsidy);
        order.selfPay = Math.max(order.total - state.subsidy, 0);
      });

      persist();
      renderAll();
      alert("設定已儲存");
    });

    document.getElementById("clearOrdersBtn").addEventListener("click", () => {
      if (!confirm("確定要清除全部訂單嗎？")) return;
      state.orders = {};
      persist();
      els.employeeSelect.value = "";
      renderOrderItems();
      els.noteInput.value = "";
      els.submitOrderBtn.textContent = "送出訂單";
      els.notice.textContent = "";
      renderAll();
    });

    document.getElementById("imageUpload").addEventListener("change", event => {
      const file = event.target.files?.[0];

      if (!file) {
        selectedMenuFile = null;
        els.selectedImageInfo.textContent =
          "可從手機相簿選擇 JPG、PNG、WebP、HEIC 等圖片";
        return;
      }

      const looksLikeImage =
        file.type.startsWith("image/") ||
        /\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(file.name);

      if (!looksLikeImage) {
        selectedMenuFile = null;
        event.target.value = "";
        els.selectedImageInfo.textContent = "請選擇圖片檔案";
        return;
      }

      if (file.size > 30 * 1024 * 1024) {
        selectedMenuFile = null;
        event.target.value = "";
        els.selectedImageInfo.textContent = "圖片太大，請選擇 30MB 以下的圖片";
        return;
      }

      selectedMenuFile = file;
      els.selectedImageInfo.textContent =
        `已選擇：${file.name}（${formatFileSize(file.size)}）`;
      els.uploadNotice.textContent = "";
      els.uploadNotice.className = "notice";
    });

    els.uploadMenuBtn.addEventListener("click", async () => {
      if (!adminUploadPassword) {
        els.uploadNotice.textContent = "❌ 請重新登入管理模式";
        els.uploadNotice.className = "notice error";
        return;
      }

      if (!selectedMenuFile) {
        els.uploadNotice.textContent = "❌ 請先選擇菜單圖片";
        els.uploadNotice.className = "notice error";
        return;
      }

      els.uploadMenuBtn.disabled = true;
      els.uploadMenuBtn.textContent = "處理圖片中…";
      els.uploadNotice.textContent = "正在壓縮並上傳圖片";
      els.uploadNotice.className = "notice";

      try {
        const processed = await convertImageToJpegBase64(selectedMenuFile);

        const formData = new FormData();
        formData.append("action", "uploadMenu");
        formData.append("password", adminUploadPassword);
        formData.append("content", processed.base64);
        formData.append("originalName", selectedMenuFile.name);

        els.uploadMenuBtn.textContent = "上傳中…";
        els.uploadNotice.textContent = "正在上傳菜單圖片";
        els.uploadNotice.className = "notice";

        const uploadResponse = await fetch(WEB_APP_URL, {
          method: "POST",
          body: formData
        });

        const uploadResult = await uploadResponse.json();
        if (!uploadResult.success) {
          throw new Error(uploadResult.message || "後端拒絕上傳");
        }

        selectedMenuFile = null;
        els.imageUpload.value = "";

        els.selectedImageInfo.textContent =
          "可從手機相簿選擇 JPG、PNG、WebP、HEIC 等圖片";

        els.uploadNotice.textContent =
          "✅ 圖片已送出，約 10～60 秒後顯示最新菜單";
        els.uploadNotice.className = "notice ok";

        setTimeout(() => { loadSharedMenuImage(); loadMenuLibrary(); }, 5000);
        setTimeout(() => { loadSharedMenuImage(); loadMenuLibrary(); }, 12000);

      } catch (error) {
        console.error(error);
        els.uploadNotice.textContent =
          `❌ 上傳失敗：${error.message || "請稍後再試"}`;
        els.uploadNotice.className = "notice error";
      } finally {
        els.uploadMenuBtn.disabled = false;
        els.uploadMenuBtn.textContent = "上傳到菜單圖片庫";
      }
    });

    document.getElementById("menuImageWrap").addEventListener("click", event => {
      const image = event.target.closest("img");
      if (!image) return;
      els.largeImage.src = image.src;
      els.imageModal.classList.add("show");
    });

    els.imageModal.addEventListener("click", () => {
      els.imageModal.classList.remove("show");
    });

    els.loginModal.addEventListener("click", event => {
      if (event.target === els.loginModal) els.loginModal.classList.remove("show");
    });

    async function loadSharedMenuImage() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=listMenus&t=${Date.now()}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.message || "無法讀取菜單");
        menuLibraryState = data;
        renderActiveMenuImages(data.activeImages || []);
      } catch (error) {
        console.warn("圖片庫讀取失敗，改用 menu.jpg", error);
        renderActiveMenuImages([MENU_IMAGE_URL]);
      }
    }

    function imageUrlForPath(path) {
      const cleanPath = String(path || "").replace(/^\.\//, "");
      return `./${cleanPath}?v=${Date.now()}`;
    }

    function renderActiveMenuImages(paths) {
      const activePaths = paths.length ? paths.slice(0, 3) : [MENU_IMAGE_URL];
      els.menuImages.innerHTML = "";
      els.menuImages.className = `menu-images count-${activePaths.length}`;
      let loadedCount = 0;

      activePaths.forEach((path, index) => {
        const image = document.createElement("img");
        image.alt = `店家菜單 ${index + 1}`;
        image.onload = () => {
          loadedCount += 1;
          els.imagePlaceholder.style.display = "none";
        };
        image.onerror = () => {
          image.remove();
          if (!loadedCount && !els.menuImages.children.length) {
            els.imagePlaceholder.style.display = "block";
          }
        };
        image.src = imageUrlForPath(path);
        els.menuImages.appendChild(image);
      });
    }

    async function loadMenuLibrary() {
      els.libraryNotice.textContent = "正在讀取圖片庫…";
      els.libraryNotice.className = "notice";
      try {
        const response = await fetch(`${WEB_APP_URL}?action=listMenus&t=${Date.now()}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.message || "讀取失敗");
        menuLibraryState = data;
        renderMenuLibrary();
        els.libraryNotice.textContent = data.images.length ? "" : "尚無歷史圖片，請先上傳一張。";
      } catch (error) {
        els.libraryNotice.textContent = `❌ 圖片庫讀取失敗：${error.message}`;
        els.libraryNotice.className = "notice error";
      }
    }

    function renderMenuLibrary() {
      els.menuLibrary.innerHTML = "";
      (menuLibraryState.images || []).slice().reverse().forEach(item => {
        const label = document.createElement("label");
        label.className = "menu-library-item";
        const checked = (menuLibraryState.activeImages || []).includes(item.path);
        if (checked) label.classList.add("selected");
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(item.path)}" ${checked ? "checked" : ""}>
          <img src="${imageUrlForPath(item.path)}" alt="${escapeHtml(item.name || "菜單圖片")}">
          <div class="menu-library-name">${escapeHtml(item.name || item.path)}</div>
        `;
        label.querySelector("input").addEventListener("change", event => {
          const selected = els.menuLibrary.querySelectorAll('input:checked');
          if (selected.length > 3) {
            event.target.checked = false;
            alert("最多只能選擇 3 張菜單圖片");
          }
          label.classList.toggle("selected", event.target.checked);
        });
        els.menuLibrary.appendChild(label);
      });
    }

    els.refreshMenusBtn.addEventListener("click", loadMenuLibrary);

    els.applyMenusBtn.addEventListener("click", async () => {
      const paths = [...els.menuLibrary.querySelectorAll('input:checked')].map(input => input.value);
      if (!paths.length) return alert("請至少選擇一張菜單圖片");
      els.applyMenusBtn.disabled = true;
      els.libraryNotice.textContent = "正在更新目前菜單…";
      try {
        const formData = new FormData();
        formData.append("action", "setActiveMenus");
        formData.append("password", adminUploadPassword);
        formData.append("paths", JSON.stringify(paths));
        const response = await fetch(WEB_APP_URL, { method: "POST", body: formData });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || "後端拒絕更新");
        els.libraryNotice.textContent = "✅ 已送出，約幾秒後顯示所選菜單";
        els.libraryNotice.className = "notice ok";
        setTimeout(() => { loadSharedMenuImage(); loadMenuLibrary(); }, 5000);
      } catch (error) {
        els.libraryNotice.textContent = `❌ 更新失敗：${error.message}`;
        els.libraryNotice.className = "notice error";
      } finally {
        els.applyMenusBtn.disabled = false;
      }
    });

    async function convertImageToJpegBase64(file) {
      const image = await loadImageFile(file);
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d", { alpha: false });
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image.element, 0, 0, width, height);

      let quality = 0.86;
      let blob = await canvasToBlob(canvas, quality);
      while (blob.size > 2.5 * 1024 * 1024 && quality > 0.55) {
        quality -= 0.1;
        blob = await canvasToBlob(canvas, quality);
      }

      if (blob.size > 4 * 1024 * 1024) {
        throw new Error("圖片壓縮後仍太大，請換一張較小的圖片");
      }

      return { base64: await blobToBase64(blob), size: blob.size };
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          const result = {
            element: image,
            width: image.naturalWidth,
            height: image.naturalHeight
          };
          URL.revokeObjectURL(objectUrl);
          resolve(result);
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("這個圖片格式無法由目前瀏覽器讀取，請改用 JPG、PNG 或 WebP"));
        };

        image.src = objectUrl;
      });
    }

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          blob => blob ? resolve(blob) : reject(new Error("圖片轉換失敗")),
          "image/jpeg",
          quality
        );
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          resolve(result.split(",")[1] || "");
        };
        reader.onerror = () => reject(new Error("圖片讀取失敗"));
        reader.readAsDataURL(blob);
      });
    }

    function formatFileSize(bytes) {
      if (bytes < 1024 * 1024) return `${Math.ceil(bytes / 1024)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function sleep(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function showError(message) {
      els.notice.textContent = message;
      els.notice.className = "notice error";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    renderOrderItems();
    renderAll();
  </script>
</body>
